name: Validate v1.2 Career and Contracts
on:
  push:
    branches: [feature/career-v12]
    paths: ['.github/workflows/validate-v12.yml', 'career.js', 'career-ui.js', 'src.js', 'engine.js', 'tests/browser-v12.cjs', 'tests/browser-smoke.cjs', 'tests/browser-curated.cjs']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/compact_franchises.py
      - run: node --test --experimental-default-type=module tests/*.test.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile scripts/*.py
      - run: node --experimental-default-type=module scripts/audit_catalogue.js
      - run: node --experimental-default-type=module scripts/audit_franchises.js
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser regression and franchise tests
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          node tests/browser-smoke.cjs
          node tests/browser-v12.cjs
          node tests/browser-curated.cjs
      - name: Save compact startup index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/franchises.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "Compact recurring character startup index"
            git push origin HEAD:feature/career-v12
          fi
