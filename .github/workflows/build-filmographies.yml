name: Build permanent actress filmographies
on:
  push:
    branches: [feature/filmographies-v141]
    paths: [scripts/build_filmographies.py, data/filmography-roster.json, .github/workflows/build-filmographies.yml]
permissions:
  contents: write
concurrency:
  group: filmographies-v141
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/filmographies-v141
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/tv-seasons-v13
          key: filmographies-v141-${{ github.run_id }}
          restore-keys: filmographies-v141-
      - name: Import dated acting credits
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/build_filmographies.py
      - name: Save complete import on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/filmographies
          git commit -m 'Add permanent acting filmographies for ten requested actresses'
          git push origin HEAD:feature/filmographies-v141
