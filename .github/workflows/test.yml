name: Test Second Take

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript tests
        run: node --test --experimental-default-type=module tests/*.test.js
      - name: Catalogue selection tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Python import tools
        run: python -m py_compile scripts/*.py
