name: Finalize v1.3 Season Data
on:
  push:
    branches: [feature/continuity-v13]
    paths: ['.github/workflows/prepare-v13-data.yml', 'scripts/split_tv_index.py']
permissions:
  contents: write
concurrency:
  group: finalize-v13-seasons
  cancel-in-progress: false
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/split_tv_index.py
      - name: Save compact index and lazy histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tv-seasons
          if ! git diff --cached --quiet; then
            git commit -m "Split saved season histories into lazy per-show files"
            git push origin HEAD:feature/continuity-v13
          fi
