name: Prepare v1.3 Season Casts
on:
  push:
    branches: [feature/continuity-v13]
    paths: ['.github/workflows/prepare-v13-data.yml', 'scripts/build_tv_seasons.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-v13-seasons
  cancel-in-progress: true
jobs:
  seasons:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/tv-seasons-v13
          key: tv-seasons-v13-${{ github.run_id }}
          restore-keys: tv-seasons-v13-
      - name: Import checkpointed season casts
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/build_tv_seasons.py
      - name: Save complete season data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tv-seasons
          git commit -m "Install verified season casts for curated TV shows" || exit 0
          git pull --rebase origin feature/continuity-v13
          git push origin HEAD:feature/continuity-v13
