name: Prepare v1.2 Franchise Links
on:
  push:
    branches: [feature/career-v12]
    paths: [.github/workflows/prepare-v12-data.yml, scripts/build_franchises.py]
permissions:
  contents: write
jobs:
  franchise-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/franchise-details
          key: franchise-details-v12-${{ github.run_id }}
          restore-keys: franchise-details-v12-
      - name: Link selected films to TMDB collections
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/build_franchises.py
      - name: Save complete franchise data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/franchises.json.gz data/franchise-projects
          git diff --cached --quiet && exit 0
          git commit -m 'Link curated films to real TMDB collections using saved casts'
          git push origin HEAD:feature/career-v12
